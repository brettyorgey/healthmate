<!DOCTYPE html>
<html lang="en">
<head>

  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "w8v3n8zinz");
  </script>
  
  <meta charset="UTF-8" />
  <title>FifthQtr Healthmate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --card-bg:#ffffff; --page-bg:#faf7f2; --text:#1e293b; --muted:#5b6779;
      --brand:#3C5B9A; --brand-dark:#2A406C; --brand-soft:#E2E6F0;
      --accent:#f97316; --ring: rgba(60,91,154,.35);
      --heading-font: 'Quicksand', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing:border-box; }
    .sr-only {
      position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
      clip:rect(0,0,0,0); white-space:nowrap; border:0;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
    }
    html { background:var(--page-bg); height:100%; }
    body {
      margin:0; background:var(--page-bg); color:var(--text); font-family: var(--heading-font);
      height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
    }
    a:focus-visible, button:focus-visible, .category-card:focus-visible, .prompt-btn:focus-visible {
      outline: 3px solid var(--ring); outline-offset: 2px;
    }
    .wrap {
      width:100%; max-width:820px; margin:24px auto; padding:0 20px;
      flex:1; display:flex; flex-direction:column; min-height:0; overflow-y:auto;
    }
    @media (max-width: 640px){
      .wrap { margin:12px auto; padding:0 12px; }
    }

    /* Header */
    .hero { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%); border-radius:20px; padding:28px; box-shadow:0 8px 24px rgba(15,94,89,0.18); margin-bottom:16px; color:#fff; }
    .hero h1 { margin:0 0 8px; font-size:30px; font-weight:700; line-height:1.25; color:#fff; letter-spacing:.2px; }
    .hero p { margin:6px 0 0; color:#e6fffa; }
    @media (max-width: 480px){
      .hero { padding:20px; border-radius:16px; }
      .hero h1 { font-size:22px; }
      .hero p { font-size:14px; }
    }

    /* Categories */
    .categories { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; margin:16px 0; }
    .category-card{
      display:flex; gap:14px; align-items:center; background:#fff; border:1px solid #eee2d3; border-radius:14px;
      padding:16px; cursor:pointer; box-shadow:0 2px 6px rgba(15,23,42,.05); width:100%; text-align:left;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .category-card:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(15,94,89,.12); border-color:var(--brand-soft); }
    .category-emoji{
      font-size:20px; width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center;
      border-radius:12px; background:var(--brand-soft);
    }
    .category-title{ font-weight:700; }
    .category-sub{ color:var(--muted); font-size:14px; }

    /* Panel */
    .prompt-panel{
      background:#fff; border:1px solid #eee2d3; border-radius:16px; padding:14px 16px; box-shadow:0 2px 6px rgba(0,0,0,.05);
      display:flex; flex-direction:column; gap:12px; animation: fadeIn .25s ease;
      flex:1; min-height:0; position:relative;
    }
    .prompt-header{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
    .back-btn{
      flex:none; width:36px; height:36px; border-radius:50%; border:0; background:transparent; color:var(--text);
      cursor:pointer; display:flex; align-items:center; justify-content:center; transition: background .15s ease;
    }
    .back-btn:hover{ background:var(--brand-soft); color:var(--brand-dark); }
    .panel-title{ font-weight:700; }
    .panel-subtitle{ color:var(--muted); font-weight:500; font-size:14px; margin-top:2px; }

    .prompts{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }
    .prompts.is-hidden{ visibility:hidden; }
    .prompts.is-gone{ display:none; }
    .prompt-btn{ text-align:left; border:1px solid #eee2d3; background:#fff; border-radius:12px; padding:12px 14px; cursor:pointer; font-size:15px; transition: background .15s ease, border-color .15s ease, transform .15s ease; }
    .prompt-btn:hover{ background:var(--brand-soft); border-color:var(--brand-soft); transform:translateX(2px); }

    @keyframes fadeIn { from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:translateY(0);} }

    /* Chat area: positioning context sized exactly to the space between header and footer,
       so the composer overlay aligns to its bottom edge without encroaching on the footer. */
    .chat-area{ position:relative; flex:1; min-height:0; display:flex; flex-direction:column; }

    /* Scroll area: the only element that scrolls within the chat pane. The top fade is
       viewport-relative (always fades content as it scrolls under the header). The bottom is left
       unmasked — padding-bottom keeps real content clear of the composer overlay entirely, so the
       last message is never cropped once scrolled fully into view. */
    .scroll-area{
      display:flex; flex-direction:column; overflow:auto; flex:1 1 auto; min-height:0; padding-right:4px;
      overscroll-behavior-y: contain;
      padding-bottom:104px;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 24px, #000 100%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 24px, #000 100%);
    }
    .scroll-content{ display:flex; flex-direction:column; gap:12px; }

    /* Chat */
    .chat{ display:flex; flex-direction:column; gap:14px; }
    .chat:empty{ display:none; }
    .msg-row{ display:flex; align-items:flex-start; animation: fadeIn .2s ease; }
    .msg-row.user{ justify-content:flex-end; }
    .msg{ max-width:80%; white-space:pre-wrap; }
    .msg.user{ background:var(--brand-soft); color:var(--brand-dark); padding:10px 14px; border-radius:14px 14px 2px 14px; text-align:left; }
    .msg.assistant{ display:flex; flex-direction:column; background:#f8f6f2; color:var(--text); padding:12px 14px; border-radius:14px 14px 14px 2px; }
    .msg.assistant .sources { order: 2; }
    .inline-controls{ order: 3; margin-top: 8px; align-self: flex-start; }

    /* Instruction headings spacing + blue bar */
    .msg.assistant h2, .msg.assistant h3{
      margin-top: 26px;
      margin-bottom: 12px;
      font-size:18px; line-height:1.3;
      border-left:4px solid var(--brand);
      padding-left:8px;
    }
    .msg.assistant h2:first-of-type,
    .msg.assistant h3:first-of-type { margin-top: 12px; }
    .msg.assistant p { margin: 8px 0 12px; }

    /* Assistant list styling (for markdown lists) */
    .msg.assistant ul { margin: 0.25rem 0 0.75rem 1.25rem; padding: 0; }
    .msg.assistant li { margin: 0.25rem 0; }

    /* Sources box */
    .sources { margin-top:12px; padding:10px; border:1px solid #e5e7eb; border-radius:10px; background:#f9fafb; }
    .sources strong{ display:block; margin-bottom:6px; }
    .sources ul{ margin:0; padding-left:18px; }
    .sources li{ margin-bottom:4px; }
    .sources a{ color:var(--brand); text-decoration:underline; }

    /* Thinking animation */
    .thinking{ display:inline-flex; gap:6px; align-items:center; color:#475569; }
    .dot{ width:6px; height:6px; border-radius:50%; background:#94a3b8; opacity:.6; animation:b 1.3s infinite ease-in-out; }
    .dot:nth-child(2){ animation-delay:.15s; } .dot:nth-child(3){ animation-delay:.3s; }
    @keyframes b { 0%,80%,100%{ transform:scale(0.7); opacity:.4; } 40%{ transform:scale(1); opacity:1; } }

    /* Form controls should use the body font, not the browser's default UI font */
    textarea, input, button, select { font-family: inherit; }

    /* Composer — single rounded card housing the textarea + control row (mimics Claude's input) */
    .inputRow{
      display:flex; flex-direction:column; gap:6px; background:rgba(255,255,255,0.88); border:1px solid #eee2d3; border-radius:26px;
      padding:12px 14px 10px; transition: box-shadow .15s ease, border-color .15s ease;
      position:absolute; left:0; right:0; bottom:0; z-index:2;
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    }
    .inputRow:focus-within{ border-color:var(--brand); box-shadow:0 0 0 3px var(--ring); }
    textarea#msg{
      flex:0 1 auto; width:100%; padding:4px 4px 6px; font-size:16px; line-height:1.4; border:0; resize:none;
      background:transparent; min-height:26px; max-height:320px; overflow-y:auto;
      scrollbar-width:none; -ms-overflow-style:none;
    }
    textarea#msg::-webkit-scrollbar{ display:none; }
    textarea#msg:focus{ outline:none; }
    .composer-row{ display:flex; align-items:center; justify-content:flex-end; gap:14px; }

    button.send{
      width:36px; height:36px; padding:0; border-radius:50%; border:0; background:var(--brand); color:#fff; cursor:pointer;
      display:flex; align-items:center; justify-content:center; flex:none;
      transition: background .15s ease, transform .1s ease;
    }
    button.send svg{ width:18px; height:18px; }
    button.send:hover{ background:var(--brand-dark); }
    button.send:active{ transform:scale(.94); }
    button.send[disabled]{ opacity:.5; cursor:not-allowed; }

    .chat-footer{ position:sticky; bottom:0; background:#fff; padding:10px 0 6px; font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:8px; }
    .chat-controls{ display:flex; gap:10px; }
    .btn-sm{ padding:8px 10px; border-radius:10px; border:1px solid #eee2d3; background:#fff; cursor:pointer; font-size:13px; transition: background .15s ease; }
    .btn-sm:hover{ background:var(--brand-soft); }

    /* Mic button — icon-only, lives inside the composer row */
    .btn-icon{
      height:36px; width:36px; padding:0; border-radius:50%; border:0; background:transparent; color:var(--muted); cursor:pointer;
      font-size:16px; display:flex; align-items:center; justify-content:center; flex:none; transition: background .15s ease;
    }
    .btn-icon:hover{ background:var(--brand-soft); }
    .mic-recording{ color:#dc2626; border-color:#fecaca; background:#fff5f5; }
    .mic-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#ef4444; margin-left:6px; animation:pulse 1s infinite; }
    @keyframes pulse{ 0%{ transform:scale(.85); opacity:.7;} 50%{ transform:scale(1); opacity:1;} 100%{ transform:scale(.85); opacity:.7;} }

    #categoryView, #promptView { display:none; }
    #categoryView.active { display:grid; animation: fadeIn .25s ease; }
    #promptView.active { display:flex; flex:1; min-height:0; animation: fadeIn .25s ease; }

    /* ---------- Triage CTA card (tight) ---------- */
    .triage-cta {
      margin: 6px 0 4px !important;
      padding-top: 8px;
      border-top: 1px solid #cbd5e1;
      animation: triageFadeIn 0.4s ease forwards;
    }
    .triage-cta__inner {
      border:1px solid #e5e7eb; border-radius:12px; padding:10px 12px;
      background:#ffffff; box-shadow:0 2px 8px rgba(0,0,0,.04);
    }
    .triage-cta__inner h3 { margin:2px 0 4px !important; font-size:16px; border-left:3px solid #0ea5e9; padding-left:6px; }
    .triage-cta__inner p  { margin:0 0 6px !important; color:#475569; }
    .triage-btns { display:flex; gap:6px; flex-wrap:wrap; }
    .triage-cta__btn {
      display:inline-flex; align-items:center; gap:6px; justify-content:center; line-height:1.2;
      padding:8px 12px; border-radius:10px;
      border:1px solid #0284c7; background:#0ea5e9; color:#fff;
      text-decoration:none; font-weight:600; transition:all .15s ease;
    }
    .triage-cta__btn:hover { background:#0284c7; border-color:#0284c7; opacity:1; }
    .triage-cta__btn.secondary-blue { background:#fff; color:#0ea5e9; border:1px solid #0ea5e9; }
    .triage-cta__btn.secondary-blue:hover { background:#e0f2fe; }
    .triage-note { margin:6px 0 0; font-size:12px; color:#64748b; opacity:0; animation: triageFadeIn .4s ease forwards; }
    @keyframes triageFadeIn { from {opacity:0; transform:translateY(2px);} to {opacity:1; transform:translateY(0);} }
    @media (max-width: 480px){
      .triage-btns { flex-direction:column; align-items:stretch; }
      .triage-cta__btn { width:100%; justify-content:center; font-size:15px; padding:12px 14px; }
    }

    .site-footer{
      display:flex; align-items:center; justify-content:center; gap:8px;
      padding:20px 16px 28px; font-size:13px; color:var(--muted);
    }
    .footer-logo{ height:16px; width:auto; display:block; }

    /* Simple inline alert for data-load errors */
    .alert {
      background:#fff7ed;
      color:#7c2d12;
      border:1px solid #fdba74;
      border-radius:10px;
      padding:10px 12px;
      margin:12px 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero" id="hero">
      <h1>Welcome — we’re here to support past players & families.</h1>
      <p>Please select a category from the options below, you'll then be provided prompt options or you can type your question into the chat.</p>
    </div>

    <!-- Categories (first screen) -->
    <div id="categoryView" class="categories active" aria-live="polite"></div>

    <!-- Prompts + chat -->
    <div id="promptView" class="prompt-panel" aria-live="polite">
      <div class="prompt-header">
        <button class="back-btn" onclick="showCategories()" type="button" aria-label="Back to categories">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div id="promptTitle" class="panel-title"></div>
      </div>

      <div class="chat-area">
        <div class="scroll-area" id="scrollArea">
          <div class="scroll-content">
            <div id="promptList" class="prompts"></div>
            <div class="chat" id="chat" aria-live="polite"></div>
          </div>
        </div>

        <div class="inputRow">
          <label for="msg" class="sr-only">Type your question</label>
          <textarea id="msg" rows="1" placeholder="Type your question…"></textarea>
          <div class="composer-row">
            <button class="btn-icon" id="micBtn" title="Speak your question" aria-label="Speak your question" type="button">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="9" y1="22" x2="15" y2="22"/></svg>
            </button>
            <button class="send" id="sendBtn" type="button" onclick="sendMsg()" aria-label="Send message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="chat-footer">
        <div>Information only — not a medical diagnosis. In an emergency call 000.</div>
        <div class="chat-controls">
          <button class="btn-sm" id="copyBtn" type="button">Copy conversation</button>
          <button class="btn-sm" id="resetBtn" type="button">Reset chat</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <span>Powered by</span>
    <a href="https://fifthqtr.org.au/" target="_blank" rel="noopener noreferrer">
      <img src="/assets/fifthqtr-logo.png" alt="FifthQtr" class="footer-logo" />
    </a>
  </footer>

  <script>
    /* ---------- TRIAGE HELPERS (client-side) ---------- */
    async function triageLoadRules(){
      try { const r = await fetch('/triage.json', {cache:'no-store'}); return r.ok ? r.json() : []; }
      catch { return []; }
    }
    function triageTextHasAny(text, list){
      if(!list || !list.length) return true;
      const t = (text||'').toLowerCase();
      return list.some(k => t.includes(k.toLowerCase()));
    }
    function triageCanonical(label){
      const { head } = parseLabel(label || '');
      return (head || '').trim().toLowerCase();
    }
    function triageMatches(rule, ctx){
      const w = rule.when || {};
      const ctxCat = triageCanonical(ctx.category);
      const wantCats = (w.categories || []).map(triageCanonical);

      if (w.categories && w.categories.length && !wantCats.includes(ctxCat)) return false;
      if (w.anyKeywords && w.anyKeywords.length && !triageTextHasAny(ctx.userText, w.anyKeywords)) return false;
      if (w.allKeywords && w.allKeywords.length && !w.allKeywords.every(k => (ctx.userText||'').toLowerCase().includes(k.toLowerCase()))) return false;
      if (w.excludeKeywords && w.excludeKeywords.length && w.excludeKeywords.some(k => (ctx.userText||'').toLowerCase().includes(k.toLowerCase()))) return false;

      return true;
    }
    function triageBuildStoryUrl(btnOrAction, ctx){
      const explicit = btnOrAction.href;
      if (explicit) {
        try {
          const u = new URL(explicit, location.origin);
          if (btnOrAction.utm) { for (const [k,v] of Object.entries(btnOrAction.utm)) u.searchParams.set('utm_'+k, v); }
          if (btnOrAction.includeTranscript) {
            const payload = { category: ctx.category, promptId: ctx.promptId, lastUserMessage: (ctx.userText||'').slice(0,1200) };
            const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
            u.searchParams.set('context_b64', b64);
            u.searchParams.set('cat', ctx.category || '');
            u.searchParams.set('prompt', ctx.promptId || '');
            u.searchParams.set('from', 'healthmate');
          }
          return u.toString();
        } catch { /* fall back */ }
      }
      const base = 'https://fifthqtr.org.au/story-form/';
      const q = new URLSearchParams();
      q.set('cat', ctx.category || '');
      q.set('prompt', ctx.promptId || '');
      q.set('from','healthmate');
      if (btnOrAction.utm){ for (const [k,v] of Object.entries(btnOrAction.utm)) q.set(`utm_${k}`, v); }
      if (btnOrAction.includeTranscript){
        const payload = { category: ctx.category, promptId: ctx.promptId, lastUserMessage: (ctx.userText||'').slice(0,1200) };
        const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
        q.set('context_b64', b64);
      }
      return `${base}?${q.toString()}`;
    }
    function triageBuildExternalUrl(btn){ return btn.href || '#'; }
    function triageRenderCTA(container, action, ctx){
      container.querySelectorAll('.triage-cta').forEach(n=>n.remove());
      const wrapper = document.createElement('div');
      wrapper.className = 'triage-cta';

      if (action.type === 'showStoryCTA'){
        const url = triageBuildStoryUrl(action, ctx);
        wrapper.innerHTML = `
          <div class="triage-cta__inner">
            <h3>${action.label || 'Share your story'}</h3>
            <p>Tell us what’s happening so we can connect you to the right support.</p>
            <div class="triage-btns">
              <a class="triage-cta__btn" href="${url}" target="_blank" rel="noopener">📝 Tell your story (FifthQtr)</a>
            </div>
          </div>`;
      } else {
        const title = action.title || action.label || 'Next options';
        const body  = action.body  || 'Choose what feels right for you:';
        wrapper.innerHTML = `
          <div class="triage-cta__inner">
            <h3>${title}</h3>
            <p>${body}</p>
            <div class="triage-btns"></div>
          </div>`;
        const btnWrap = wrapper.querySelector('.triage-btns');
        if (Array.isArray(action.buttons)){
          action.buttons.forEach(btn=>{
            const a = document.createElement('a');
            const styleClass = btn.style ? ` ${btn.style}` : (btn.kind === 'external' ? ' secondary-blue' : '');
            a.className = 'triage-cta__btn' + styleClass;
            a.textContent = btn.label || (btn.kind === 'story' ? '📝 Tell your story (FifthQtr)' : '💬 Join a forum (SANE)');
            if (btn.kind === 'story'){
              a.href = triageBuildStoryUrl(btn, ctx);
              a.target = '_blank'; a.rel='noopener';
            } else {
              a.href = triageBuildExternalUrl(btn);
              a.target = (btn.target || '_blank'); a.rel='noopener';
            }
            a.setAttribute('aria-label', a.textContent + ' (opens in new tab)');
            btnWrap.appendChild(a);
          });
        }
        if (Array.isArray(action.buttons) && action.buttons.length > 1) {
          const note = document.createElement('p');
          note.className = 'triage-note';
          note.textContent = 'Links open in a new tab. You can keep chatting here anytime.';
          wrapper.querySelector('.triage-cta__inner').appendChild(note);
        }
      }
      const sources = container.querySelector('.sources');
      if (sources && sources.parentElement === container) container.insertBefore(wrapper, sources);
      else container.appendChild(wrapper);
    }
    async function triageEvaluateAndRender(ctx){
      const rules = await triageLoadRules();
      const matches = rules
        .filter(r => triageMatches(r, ctx))
        .sort((a,b) => (b.action?.priority || 0) - (a.action?.priority || 0));
      if (!matches.length || !ctx.assistantEl) return;
      const chosen = matches[0];
      if (!chosen.action) return;
      if (chosen.action.type !== 'showStoryCTA' && chosen.action.type !== 'showOptions') return;
      const delay = chosen.action.delayMs || 0;
      setTimeout(() => { triageRenderCTA(ctx.assistantEl, chosen.action, ctx); }, delay);
    }
  </script>

  <script>
    // Reset per-load
    sessionStorage.removeItem('fq_thread_id');
    sessionStorage.removeItem('fq_has_initial_answer');

    function removeDeadLinkMarkers(text){
      return (text || '').replace(/\s*\(link unavailable\)/gi, '');
    }

    /* ---------- Robust label parsing ---------- */
    function parseLabel(label=''){
      const raw = String(label || '');
      const m = raw.match(/^\s*([^–\-:]+?)\s*[–\-:]\s+(.+)\s*$/);
      if (!m) return { head: raw.trim(), sub: '' };
      return { head: (m[1]||'').trim(), sub: (m[2]||'').trim() };
    }

    // Canonical category key for the server (use parsed head)
    function canonicalCategoryKey(label='') {
      const { head } = parseLabel(label);
      const key = (head || label || '').trim().toLowerCase();
      const map = {
        'physical': 'physical',
        'psychological': 'psychological',
        'career': 'career',
        'family': 'family',
        'cultural': 'cultural',
        'identity': 'identity',
        'financial': 'financial',
        'environmental': 'environmental',
        'female': 'female',
        'aged care': 'aged_care'
      };
      return map[key] || null;
    }

    // State
    const TRANSCRIPT=[]; let PROMPTS={};
    let CURRENT_PROMPT_ID = '';
    let CURRENT_PROMPT_META = null;
    let CURRENT_CATEGORY_LABEL = '';

    // DOM
    const categoryView=document.getElementById('categoryView');
    const promptView=document.getElementById('promptView');
    const promptTitle=document.getElementById('promptTitle');
    const promptList=document.getElementById('promptList');
    const chatEl=document.getElementById('chat');

    // Once the chat has started, remove the prompt list from layout entirely (space is precious in
    // the fixed-height chat pane). Before that, hide it (but keep its space reserved, so the
    // composer doesn't jump) while the user is mid-typing; bring it back once the box is empty.
    function refreshPromptVisibility(){
      const msgEl = document.getElementById('msg');
      if(!msgEl) return;
      const chatStarted = chatEl.children.length > 0;
      promptList.classList.toggle('is-gone', chatStarted);
      promptList.classList.toggle('is-hidden', !chatStarted && msgEl.value.trim().length > 0);
    }

    /* ---------- Model-link hardening ---------- */
    const STRIP_MODEL_LINKS = true;

    function stripAnySourcesBlocks(md){
      if(!md) return md;
      return md.replace(
        /(^|\n)(?:#{1,3}\s*)?(?:\*\s*)?(?:relevant\s+sources?|sources)\s*:?\s*(?:\*\s*)?\n[\s\S]*?(?=(\n#{1,3}\s)|\n?$)/gi,
        '$1'
      );
    }
    function stripModelLinks(md){
      if(!md) return md;
      let s = md;
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/gi, '$1');
      s = s.replace(/https?:\/\/[^\s)]+/gi, '').replace(/[ \t]{2,}/g,' ');
      return s;
    }
    function stripSourcesSection(md){
      if (!md) return md;
      return md.replace(/(^|\n)##\s*Sources[\s\S]*?(?=(\n##\s)|\n?$)/i, '$1');
    }

    // Escape HTML
    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // Minimal Markdown → HTML
    function mdToHtml(md){
      if(!md) return '';
      let s = esc(md);
      if (!STRIP_MODEL_LINKS) {
        s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
          (_m,label,url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`);
      }
      s = s.replace(/^###\s+(.*)$/gm,'<h3>$1</h3>');
      s = s.replace(/^##\s+(.*)$/gm,'<h2>$1</h2>');
      s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      s = s.replace(/(^|\n)(?:- .*(?:\n- .*)*)/g, (block) => {
        const lines = block.trim().split('\n');
        if (!lines.every(l => l.trim().startsWith('- '))) return block;
        const items = lines.map(l => `<li>${l.trim().slice(2)}</li>`).join('');
        return `\n<ul>${items}</ul>`;
      });
      const blocks = s.split(/\n{2,}/).map(chunk => {
        if (/^\s*(<h2|<h3|<ul|<p|<blockquote|<pre|<table|<ol)/i.test(chunk)) return chunk;
        return `<p>${chunk.replace(/\n/g,'<br/>')}</p>`;
      });
      return blocks.join('\n');
    }

    // Sources box for curated sources only
    function renderSourcesBox(parent, sources){
      if(!Array.isArray(sources) || !sources.length) return;
      parent.querySelectorAll('.sources, .inline-controls').forEach(n => n.remove());

      const box = document.createElement('div');
      box.className = 'sources';
      const h = document.createElement('strong');
      h.textContent = 'Sources';
      box.appendChild(h);

      const ul = document.createElement('ul');
      for(const s of sources){
        const li = document.createElement('li');
        if(s.url){
          const a = document.createElement('a');
          a.href = s.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = s.title || s.url;
          li.appendChild(a);
        } else if (s.file_id){
          const a = document.createElement('a');
          a.href = `/api/file?file_id=${encodeURIComponent(s.file_id)}`;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = s.filename || 'Document';
          li.appendChild(a);
        } else {
          li.textContent = s.title || s.filename || 'Source';
        }
        ul.appendChild(li);
      }
      box.appendChild(ul);
      parent.appendChild(box);

      const controls = document.createElement('div');
      controls.className = 'inline-controls';
      const listenBtn = document.createElement('button');
      listenBtn.type = 'button';
      listenBtn.className = 'btn-sm';
      listenBtn.textContent = '🔊 Listen';
      listenBtn.addEventListener('click', ()=> {
        const text = parent.textContent || '';
        speakText(text);
      });
      controls.appendChild(listenBtn);
      parent.appendChild(controls);
    }

    function normalizeFollowupHeadings(text){
      if(!text) return '';
      return text
        .replace(/^\s*Why this matters.*$/gmi,'## Why this matters')
        .replace(/^\s*Sources.*$/gmi,'## Sources');
    }
    function normalizeSectionHeadings(text){
      if(!text) return text;
      const list=['What to do now','Why this matters','Who to contact','What to bring','Watch for and act on','Red-flags','Sources'];
      let out=text;
      for(const h of list){
        const re=new RegExp(`^\\s*\\**\\s*${h}\\s*:?\\s*\\**\\s*$`,'gmi');
        out=out.replace(re,`## ${h}`);
      }
      return out;
    }
    function stripInlineDisclaimer(text){
      if(!text) return text;
      return text.replace(/Information only\s*—\s*not a medical diagnosis.*000\.*\s*/gmi,'').trim();
    }
    function cleanFooterHeading(text){
      if (!text) return text;
      let out = text.replace(/^\s*-{3,}\s*$/gmi, '');
      out = out.replace(/^\s*(?:#{1,6}\s*)?(?:\*{0,2}\s*)?(?:\d+\)\s*)?Footer\s*:?\s*(?:\*{0,2})?\s*$/gmi,'');
      out = out.replace(/\n{3,}/g, '\n\n').trim();
      return out;
    }

    /* TTS */
    function speakText(text){
      if(!('speechSynthesis' in window)){ alert('Speech not supported on this browser'); return; }
      try{
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-AU'; u.rate = 1.0; u.pitch = 1.0;
        window.speechSynthesis.speak(u);
      }catch(e){ console.warn('TTS error:', e); }
    }

    /* STT */
    let recognition = null, listening = false;
    function getRecognition(){
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SR) return null;
      const r = new SR(); r.lang='en-AU'; r.interimResults=false; r.maxAlternatives=1; return r;
    }
    const MIC_ICON_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="9" y1="22" x2="15" y2="22"/></svg>';
    function updateMicUI(active){
      const btn = document.getElementById('micBtn');
      if(!btn) return;
      if(active){ btn.classList.add('mic-recording'); btn.innerHTML = MIC_ICON_SVG + '<span class="mic-dot"></span>'; btn.title='Stop recording'; }
      else { btn.classList.remove('mic-recording'); btn.innerHTML = MIC_ICON_SVG; btn.title='Speak your question'; }
    }
    function startListening(){
      if(listening) return;
      recognition = getRecognition();
      if(!recognition){ alert('Speech recognition not supported in this browser. Try Chrome or Edge.'); return; }
      listening = true; updateMicUI(true);
      recognition.onresult = (e)=>{ const t=e.results[0][0].transcript; document.getElementById('msg').value=t; sendMsg(t); };
      recognition.onerror = ()=>{ updateMicUI(false); listening=false; };
      recognition.onend = ()=>{ updateMicUI(false); listening=false; };
      try{ recognition.start(); }catch(e){ updateMicUI(false); listening=false; }
    }
    function stopListening(){ if(recognition && listening){ try{ recognition.stop(); }catch(_){} } }

    // Client-side fetch with timeout
    async function fetchWithTimeout(url, options={}, ms=30000){
      const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), ms);
      try { return await fetch(url, { ...options, signal: ctl.signal }); }
      finally { clearTimeout(t); }
    }

    function addMsg(role,text,sources){
      const entry = {role, text: text || ''};
      TRANSCRIPT.push(entry);

      const row=document.createElement('div'); row.className='msg-row '+role;
      const div=document.createElement('div'); div.className='msg '+role;

      if(role==='assistant'){
        const isFollowUp = sessionStorage.getItem('fq_has_initial_answer') === '1';
        let cleaned = normalizeSectionHeadings(text || '');
        if (isFollowUp) cleaned = normalizeFollowupHeadings(cleaned);
        cleaned = stripInlineDisclaimer(cleaned);
        cleaned = cleanFooterHeading(cleaned);
        cleaned = removeDeadLinkMarkers(cleaned);

        cleaned = stripAnySourcesBlocks(cleaned);
        cleaned = stripSourcesSection(cleaned);
        if (STRIP_MODEL_LINKS) cleaned = stripModelLinks(cleaned);

        div.innerHTML = mdToHtml(cleaned);

        if (Array.isArray(sources) && sources.length) {
          renderSourcesBox(div, sources);
        }

        if(!sessionStorage.getItem('fq_has_initial_answer')) sessionStorage.setItem('fq_has_initial_answer','1');
      } else {
        div.textContent = text;
      }
      row.appendChild(div);
      chatEl.appendChild(row);
      const scrollAreaEl = document.getElementById('scrollArea');
      if(scrollAreaEl) scrollAreaEl.scrollTop = scrollAreaEl.scrollHeight;
      refreshPromptVisibility();
      div.remove = () => row.remove();
      return div;
    }

    function showThinking(){
      const d = addMsg('assistant','');
      d.innerHTML = `
        <span class="thinking" role="status" aria-live="polite">
          Thinking…
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </span>`;
      return d;
    }

    async function pollUntilReady(threadId, originalUserText, thinkingEl, tries=12){
      for (let i=0; i<tries; i++){
        await new Promise(r=>setTimeout(r, 2500));
        const { head } = parseLabel(CURRENT_CATEGORY_LABEL || '');
        const r = await fetchWithTimeout('/api/mascot', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            peek:true,
            thread_id: threadId,
            message: originalUserText,
            categoryLabel: CURRENT_CATEGORY_LABEL || '',
            categoryKey: canonicalCategoryKey(head || ''),
            promptId: CURRENT_PROMPT_ID || '',
            promptMeta: CURRENT_PROMPT_META || null
          })
        }, 15000);
        const data = await r.json().catch(()=> ({}));
        if (r.ok && !data.pending && (data.output || data.error)){
          thinkingEl?.remove();
          if (data.error) {
            addMsg('assistant', 'Sorry — server error ('+data.error+')');
          } else {
            const assistantEl = addMsg('assistant', data.output || 'No response', data.sources || []);
            triageEvaluateAndRender({
              category: parseLabel(CURRENT_CATEGORY_LABEL || '').head || '',
              promptId: CURRENT_PROMPT_ID || '',
              userText: originalUserText || '',
              assistantEl
            });
          }
          return;
        }
      }
      thinkingEl?.remove();
      addMsg('assistant', 'Still working — please press “Send” again to retry.');
    }

    async function sendMsg(txt){
      categoryView.classList.remove('active');
      promptView.classList.add('active');

      const inp=document.getElementById('msg');
      const content=(txt||inp.value||'').trim(); if(!content) return;

      if (typeof txt === 'undefined') { CURRENT_PROMPT_ID = ''; CURRENT_PROMPT_META = null; }

      addMsg('user',content);
      inp.value=''; inp.style.height='auto'; refreshPromptVisibility(); document.getElementById('sendBtn').disabled=true;
      const thinkingEl = showThinking();

      try{
        const isFollowUp = sessionStorage.getItem('fq_has_initial_answer') === '1';
        const threadId   = sessionStorage.getItem('fq_thread_id') || null;
        const { head }   = parseLabel(CURRENT_CATEGORY_LABEL || '');
        const catKey     = canonicalCategoryKey(head || '');

        const r = await fetchWithTimeout('/api/mascot',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            message: content,
            followup: isFollowUp,
            thread_id: threadId,
            categoryLabel: CURRENT_CATEGORY_LABEL || '',
            categoryKey: catKey,
            promptId: CURRENT_PROMPT_ID || '',
            promptMeta: CURRENT_PROMPT_META || null
          })
        }, 30000);
        const data = await r.json().catch(()=> ({}));

        if (r.status === 202 && data.pending && data.thread_id){
          sessionStorage.setItem('fq_thread_id', data.thread_id);
          await pollUntilReady(data.thread_id, content, thinkingEl);
          return;
        }

        thinkingEl.remove();

        if(!r.ok){
          addMsg('assistant','Sorry — server error' + (data?.error ? ` (${data.error})` : ''));
          return;
        }

        if (data.thread_id && (data.output || '').trim().toLowerCase() === 'no response') {
          sessionStorage.setItem('fq_thread_id', data.thread_id);
          const thinkingAgain = showThinking();
          await pollUntilReady(data.thread_id, content, thinkingAgain);
          return;
        }

        const assistantEl = addMsg('assistant', data.output || 'No response', data.sources || []);
        if (data.thread_id) sessionStorage.setItem('fq_thread_id', data.thread_id);

        triageEvaluateAndRender({
          category: parseLabel(CURRENT_CATEGORY_LABEL || '').head || '',
          promptId: CURRENT_PROMPT_ID || '',
          userText: content || '',
          assistantEl
        });

      }catch(e){
        thinkingEl.remove();
        addMsg('assistant','Sorry — network error.');
      }finally{
        document.getElementById('sendBtn').disabled=false;
      }
    }

    function resetChat(){ TRANSCRIPT.length=0; chatEl.innerHTML=''; sessionStorage.clear(); refreshPromptVisibility(); }

    function categoryEmoji(label){
      const { head } = parseLabel(label || '');
      if(!head) return '❖';
      const map = [
        { key: 'Psychological',  emoji: '🧠' },
        { key: 'Physical',       emoji: '🏋️' },
        { key: 'Career',         emoji: '💼' },
        { key: 'Family',         emoji: '👨‍👩‍👧‍👦' },
        { key: 'Cultural',       emoji: '🌏' },
        { key: 'Identity',       emoji: '🎭' },
        { key: 'Financial',      emoji: '💰' },
        { key: 'Environmental',  emoji: '⚠️' },
        { key: 'Female',         emoji: '♀️' },
        { key: 'Aged Care',      emoji: '🧓' }
      ];
      const hit = map.find(m => head.toLowerCase().startsWith(m.key.toLowerCase()));
      return hit ? hit.emoji : '❖';   /* <-- fixed (was m.emoji) */
    }

    // ---------- prompts.json helpers ----------
    function normalizePromptsShape(data) {
      if (!data) return {};
      if (!Array.isArray(data) && typeof data === 'object') return data; // already object map
      if (Array.isArray(data)) {
        const out = {};
        for (const item of data) {
          if (item && typeof item === 'object') {
            const label = String(item.label || '').trim();
            const prompts = Array.isArray(item.prompts) ? item.prompts : [];
            if (label) out[label] = prompts;
          }
        }
        return out;
      }
      return {};
    }
    function showInlineAlert(msg) {
      const el = document.createElement('div');
      el.className = 'alert';
      el.textContent = msg;
      const wrap = document.querySelector('.wrap') || document.body;
      wrap.insertBefore(el, wrap.firstChild.nextSibling);
    }

    // ---------- load & render categories ----------
    async function loadPrompts(){
      try {
        const res = await fetch('/prompts.json', { cache: 'no-store' });
        if (!res.ok) {
          console.error('Failed to fetch /prompts.json:', res.status);
          showInlineAlert('Unable to load categories (prompts.json not available).');
          PROMPTS = {};
          renderCategories();
          return;
        }

        const raw = await res.json();
        const norm = normalizePromptsShape(raw);

        if (!norm || typeof norm !== 'object' || !Object.keys(norm).length) {
          console.warn('prompts.json loaded but appears empty or malformed:', raw);
          showInlineAlert('No categories found in prompts.json. Please check its format.');
          PROMPTS = {};
        } else {
          PROMPTS = norm;
        }
        renderCategories();
      } catch (e) {
        console.error('Error loading /prompts.json:', e);
        showInlineAlert('Error loading categories. See console for details.');
        PROMPTS = {};
        renderCategories();
      }
    }

    function renderCategories(){
      document.getElementById('hero').style.display = '';
      categoryView.innerHTML = '';

      const labels = Object.keys(PROMPTS || {});
      if (!labels.length) {
        const empty = document.createElement('div');
        empty.className = 'alert';
        empty.innerHTML = [
          'No categories to display.',
          ' Check that <code>/prompts.json</code> exists and contains keys like ',
          '<code>"Psychological – Mental Health"</code> or <code>"Physical – Injury Management"</code>.'
        ].join('');
        categoryView.appendChild(empty);
        categoryView.classList.add('active');
        promptView.classList.remove('active');
        resetChat();
        document.getElementById('msg').value='';
        CURRENT_PROMPT_ID = '';
        CURRENT_PROMPT_META = null;
        return;
      }

      labels.forEach(label=>{
        const { head, sub } = parseLabel(label);

        const card=document.createElement('button'); card.type='button'; card.className='category-card';
        const em=document.createElement('div'); em.className='category-emoji'; em.textContent = categoryEmoji(head || label);
        em.setAttribute('aria-hidden','true');

        const textWrap=document.createElement('div');
        const title=document.createElement('div'); title.className='category-title'; title.textContent = head || label;

        textWrap.appendChild(title);
        if (sub) {
          const subEl=document.createElement('div'); subEl.className='category-sub'; subEl.textContent = sub;
          textWrap.appendChild(subEl);
        }

        card.appendChild(em); card.appendChild(textWrap);
        card.addEventListener('click',()=>showPrompts(label));
        categoryView.appendChild(card);
      });
      categoryView.classList.add('active');
      promptView.classList.remove('active');
      resetChat();
      document.getElementById('msg').value='';
      CURRENT_PROMPT_ID = '';
      CURRENT_PROMPT_META = null;
    }

    // Backwards compatible: supports string prompts and object prompts
    function asPromptText(p){ return (typeof p === 'string') ? p : (p?.prompt || ''); }
    function asPromptSlug(p){
      const base = asPromptText(p);
      return base.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    }

    function showPrompts(label){
      sessionStorage.clear();
      document.getElementById('hero').style.display = 'none';
      CURRENT_CATEGORY_LABEL = label;
      const { head, sub } = parseLabel(label);
      promptTitle.innerHTML = '';
      const titleMain = document.createElement('div');
      titleMain.textContent = head || label;
      promptTitle.appendChild(titleMain);
      if (sub) {
        const titleSub = document.createElement('div');
        titleSub.className = 'panel-subtitle';
        titleSub.textContent = sub;
        promptTitle.appendChild(titleSub);
      }
      promptList.innerHTML = '';

      (PROMPTS[label]||[]).forEach(p=>{
        const text = asPromptText(p);
        const btn=document.createElement('button');
        btn.className='prompt-btn';
        btn.type='button';
        btn.textContent=text;
        btn.addEventListener('click',()=>{
          CURRENT_PROMPT_ID   = asPromptSlug(p);
          CURRENT_PROMPT_META = (typeof p === 'object' && p) ? p : { prompt: text };
          sendMsg(text);
        });
        promptList.appendChild(btn);
      });

      categoryView.classList.remove('active');
      promptView.classList.add('active');
      document.getElementById('scrollArea').scrollTop=0;
      refreshPromptVisibility();
    }

    function showCategories(){ renderCategories(); }

    // Init
    document.addEventListener('DOMContentLoaded', ()=>{
      loadPrompts();
      document.getElementById('copyBtn').addEventListener('click', ()=>navigator.clipboard.writeText(
        TRANSCRIPT.map(m=>`${m.role.toUpperCase()}: ${m.text}`).join('\n\n') || '(empty)'
      ));
      document.getElementById('resetBtn').addEventListener('click', resetChat);
      const msgEl = document.getElementById('msg');
      msgEl.addEventListener('keydown', (e)=>{
        if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); }
      });
      const resizeNow = ()=>{ msgEl.style.height='auto'; msgEl.style.height = Math.min(msgEl.scrollHeight, 320)+'px'; };
      const autoGrow = ()=>{ resizeNow(); requestAnimationFrame(resizeNow); };
      msgEl.addEventListener('input', autoGrow);
      msgEl.addEventListener('paste', autoGrow);
      autoGrow();

      // Keep the scroll area's bottom clearance matching the composer's real height (plus a small
      // breathing-room gap), so the last message always ends just above the composer's top —
      // no dead space beyond that, but not flush against it either.
      const inputRowEl = document.querySelector('.inputRow');
      const scrollAreaEl = document.getElementById('scrollArea');
      const COMPOSER_GAP = 16;
      const syncComposerClearance = ()=>{
        scrollAreaEl.style.paddingBottom = (inputRowEl.getBoundingClientRect().height + COMPOSER_GAP) + 'px';
      };
      if ('ResizeObserver' in window) {
        new ResizeObserver(syncComposerClearance).observe(inputRowEl);
      } else {
        window.addEventListener('resize', syncComposerClearance);
      }
      syncComposerClearance();
      msgEl.addEventListener('focus', refreshPromptVisibility);
      msgEl.addEventListener('blur', refreshPromptVisibility);
      msgEl.addEventListener('input', refreshPromptVisibility);
      document.getElementById('micBtn').addEventListener('click', ()=> listening ? stopListening() : startListening());
    });
  </script>
</body>
</html>
